name: Publish Signal 2.5.2
on:
  push:
    branches: [signal-release-v2.5.2]
    paths: [.github/workflows/attach-signal-252.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish the signed offline APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.5.1 -p Signal-2.5.1.apk --repo "$GITHUB_REPOSITORY"
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/distribution/patch252.zst" -o patch.zst
          zstd -q -d --long=30 --patch-from=Signal-2.5.1.apk patch.zst -o Signal-2.5.2.apk
          echo 'b898a68196fbf7c32a0bbb4bd8c0f5b16064735b3957762dce65137ce1d182b1  Signal-2.5.2.apk' | sha256sum -c
          gh release upload v2.5.2 Signal-2.5.2.apk --repo "$GITHUB_REPOSITORY"
          gh release edit v2.5.2 --draft=false --latest --repo "$GITHUB_REPOSITORY"
