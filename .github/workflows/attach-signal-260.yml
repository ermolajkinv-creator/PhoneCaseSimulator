name: Publish Signal 2.6.0
on:
  push:
    branches: [signal-release-v2.6.0]
    paths: [.github/workflows/attach-signal-260.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish the signed offline APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.5.2 -p Signal-2.5.2.apk --repo "$GITHUB_REPOSITORY"
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/distribution/patch260.zst" -o patch.zst
          zstd -q -d --long=30 --patch-from=Signal-2.5.2.apk patch.zst -o Signal-2.6.0.apk
          echo 'db184abd1212157fe1c0980dedf66c47480fd1c6087aac1fc439224483f4444a  Signal-2.6.0.apk' | sha256sum -c
          gh release upload v2.6.0 Signal-2.6.0.apk --repo "$GITHUB_REPOSITORY"
          gh release edit v2.6.0 --draft=false --latest --repo "$GITHUB_REPOSITORY"
