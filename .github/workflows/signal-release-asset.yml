name: Attach Signal 1.8.0 APK
on:
  push:
    branches: [signal-release-v1.8.0]
    paths: [.github/workflows/signal-release-asset.yml]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and attach the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 --output Signal-5000.apk "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/downloads/Signal-5000.apk"
          echo '44abcd11cba351af3fe19dd69e079b176c3ba32c994050491dde011ff74b453d  Signal-5000.apk' | sha256sum --check
          gh release upload v1.8.0 Signal-5000.apk --repo "$GITHUB_REPOSITORY"
