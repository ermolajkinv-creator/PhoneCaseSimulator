name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build installable APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature and minimum SDK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-info.txt
          grep -q "sdkVersion:'26'" apk-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCaseSimulator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            apk-info.txt
  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 34, 35, 36, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check published emulator image
        id: image
        env:
          API: ${{ matrix.api }}
        run: |
          sdkmanager --list > /tmp/sdk-packages.txt
          if grep -Fq "system-images;android-$API;google_apis;x86_64" /tmp/sdk-packages.txt; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$API" = 37 ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Android 17 / API 37 image is unavailable: NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Required emulator image for API $API unavailable" >&2
            exit 1
          fi
      - name: Enable KVM
        if: steps.image.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        if: steps.image.outputs.available == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.image.outputs.available == 'true'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
            if [ '${{ matrix.api }}' = '35' ]; then python3 .github/scripts/world_ui_qa.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/world-qa/
